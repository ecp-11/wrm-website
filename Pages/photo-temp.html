<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo — Coming Soon — Whispering River Media</title>
  <meta name="description" content="The photo journal is currently in development — coming soon from Whispering River Media.">
  <link rel="icon" href="brand_assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;300;400&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --parchment: #F2EDE6;
      --linen:     #FAF8F5;
      --ash:       #C4BFB8;
      --stone:     #857F78;
      --slate:     #44403B;
      --charcoal:  #1C1A17;
      --sage:      #7D8C7A;
      --font-display: 'Josefin Sans', sans-serif;
      --font-body:    'EB Garamond', serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-y: scroll; }
    body {
      background: #151310;
      color: var(--parchment);
      font-family: var(--font-display);
      -webkit-font-smoothing: antialiased;
    }
    a   { color: inherit; text-decoration: none; }
    img { display: block; }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 200;
      opacity: 0.3;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.11 0 0 0 0 0.10 0 0 0 0 0.09 0 0 0 0.045 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      mix-blend-mode: screen;
    }

    /* ─── Navigation ──────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 48px;
      padding: 28px 36px;
    }

    .nav-link {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--parchment);
      opacity: 0.72;
      transition: opacity 0.4s ease;
    }

    .nav-link:hover { opacity: 1; }
    .nav-link.nav-primary { font-size: 13px; }
    .nav-brand {
      position: absolute;
      left: 36px;
      top: 28px;
      font-family: var(--font-display);
      font-weight: 100;
      font-size: 13px;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--parchment);
      opacity: 0.72;
      transition: opacity 0.4s ease;
    }
    .nav-brand:hover { opacity: 1; }


    /* ─── Info Dropdown ────────────────────────────── */
    .nav-dropdown { position: relative; }

    .nav-dropdown-trigger {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-family: var(--font-display);
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--parchment);
      opacity: 0.72;
      transition: opacity 0.4s ease;
      position: relative;
    }

    .nav-dropdown-trigger:hover { opacity: 1; }
    .nav-dropdown-trigger:focus-visible { outline: 1px solid var(--sage); outline-offset: 4px; }

    .nav-dropdown-trigger::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%) scaleX(0);
      width: 16px;
      height: 1px;
      background: var(--parchment);
      opacity: 0.3;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .nav-dropdown.open .nav-dropdown-trigger::after { transform: translateX(-50%) scaleX(1); }

    .nav-dropdown-menu {
      position: absolute;
      top: calc(100% + 14px);
      left: 50%;
      transform: translateX(-50%) translateY(-6px);
      min-width: 140px;
      padding: 14px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(5, 4, 3, 0.85);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(196, 191, 184, 0.08);
      border-radius: 6px;
      box-shadow:
        0 12px 40px -16px rgba(0, 0, 0, 0.5),
        0 2px 8px rgba(0, 0, 0, 0.2);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                  visibility 0.25s;
      pointer-events: none;
    }

    .nav-dropdown.open .nav-dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .nav-dropdown-item {
      display: block;
      width: 100%;
      padding: 10px 28px;
      text-align: center;
      font-family: var(--font-display);
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--parchment);
      opacity: 0.55;
      transition: opacity 0.3s ease;
      white-space: nowrap;
    }

    .nav-dropdown-item:hover,
    .nav-dropdown-item:focus-visible { opacity: 1; }
    .nav-dropdown-item:focus-visible { outline: 1px solid var(--sage); outline-offset: -2px; }
    .nav-dropdown-item:focus-visible { outline: 1px solid var(--sage); outline-offset: -2px; }

    /* ─── Coming soon ─────────────────────────────── */
    .coming-soon {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 140px 32px 100px;
    }

    .coming-soon .eyebrow {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--stone);
      opacity: 0;
      animation: fadeOnly 1.2s ease 0.1s forwards;
    }

    .coming-soon h1 {
      font-family: var(--font-display);
      font-weight: 100;
      font-size: clamp(40px, 7vw, 88px);
      letter-spacing: 0.05em;
      line-height: 1.15;
      color: var(--parchment);
      margin-top: 20px;
      opacity: 0;
      animation: fadeOnly 1.4s ease 0.3s forwards;
    }

    .coming-soon .divider {
      width: 48px;
      height: 1px;
      background: var(--sage);
      margin: 36px 0;
      transform: scaleX(0);
      opacity: 0;
      animation: dividerIn 1.2s ease 0.75s forwards;
    }

    .coming-soon p {
      font-family: var(--font-body);
      font-style: italic;
      font-size: clamp(15px, 1.6vw, 18px);
      line-height: 1.7;
      color: var(--stone);
      max-width: 44ch;
      opacity: 0;
      animation: fadeOnly 1.4s ease 0.95s forwards;
    }

    /* ─── Animations ──────────────────────────────── */
    @keyframes fadeOnly {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes dividerIn {
      from { transform: scaleX(0); opacity: 0; }
      to   { transform: scaleX(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-brand">WRM</a>
    <a href="film.html" class="nav-link nav-primary">Film</a>
    <div class="nav-dropdown" id="infoDropdown">
      <button class="nav-dropdown-trigger nav-center"
              aria-expanded="false"
              aria-haspopup="true"
              aria-controls="infoMenu">Info</button>
      <div class="nav-dropdown-menu" id="infoMenu" role="menu">
        <a href="WRMinfo.html" class="nav-dropdown-item" role="menuitem">WRM Info</a>
        <a href="about.html" class="nav-dropdown-item" role="menuitem">About Me</a>
        <a href="WRMinfo.html#contact" class="nav-dropdown-item" role="menuitem">Get in Touch</a>
      </div>
    </div>
    <a href="photo-temp.html" class="nav-link nav-primary">Photo</a>
  </nav>

  <section class="coming-soon">
    <p class="eyebrow">Photo</p>
    <h1>Coming soon</h1>
    <div class="divider"></div>
    <p>A new visual journal — stills gathered from the field — is currently being prepared. Check back soon.</p>
  </section>

  <script>
    (function () {
      var dropdown = document.getElementById('infoDropdown');
      var trigger = dropdown.querySelector('.nav-dropdown-trigger');
      var menu = document.getElementById('infoMenu');
      function open() { dropdown.classList.add('open'); trigger.setAttribute('aria-expanded', 'true'); }
      function close() { dropdown.classList.remove('open'); trigger.setAttribute('aria-expanded', 'false'); }
      trigger.addEventListener('click', function (e) { e.stopPropagation(); dropdown.classList.contains('open') ? close() : open(); });
      document.addEventListener('click', function (e) { if (!dropdown.contains(e.target)) close(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
      menu.addEventListener('keydown', function (e) {
        var items = menu.querySelectorAll('.nav-dropdown-item');
        var cur = Array.prototype.indexOf.call(items, document.activeElement);
        if (e.key === 'ArrowDown') { e.preventDefault(); items[(cur + 1) % items.length].focus(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); items[(cur - 1 + items.length) % items.length].focus(); }
      });
      trigger.addEventListener('keydown', function (e) { if (e.key === 'ArrowDown' && !dropdown.classList.contains('open')) { e.preventDefault(); open(); menu.querySelector('.nav-dropdown-item').focus(); } });
      dropdown.addEventListener('focusout', function () { setTimeout(function () { if (!dropdown.contains(document.activeElement)) close(); }, 0); });
    })();
  </script>

</body>
</html>
