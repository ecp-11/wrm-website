<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo — Coming Soon — Whispering River Media</title>
  <meta name="description" content="The photo journal is currently in development — coming soon from Whispering River Media.">
  <link rel="icon" href="brand_assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;300;400&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --parchment: #F2EDE6;
      --linen:     #FAF8F5;
      --ash:       #C4BFB8;
      --stone:     #857F78;
      --slate:     #44403B;
      --charcoal:  #1C1A17;
      --sage:      #7D8C7A;
      --font-display: 'Josefin Sans', sans-serif;
      --font-body:    'EB Garamond', serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-y: scroll; }
    body {
      background: #151310;
      color: var(--parchment);
      font-family: var(--font-display);
      -webkit-font-smoothing: antialiased;
    }
    a   { color: inherit; text-decoration: none; }
    img { display: block; }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 200;
      opacity: 0.3;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.11 0 0 0 0 0.10 0 0 0 0 0.09 0 0 0 0.045 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      mix-blend-mode: screen;
    }

    /* ─── Navigation ──────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 36px;
      background: rgba(21, 19, 16, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(196, 191, 184, 0.12);
    }
    .nav-brand {
      font-family: var(--font-display);
      font-weight: 100;
      font-size: 13px;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--parchment);
      transition: opacity 0.3s ease;
    }
    .nav-brand:hover { opacity: 0.6; }
    .nav-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 36px;
    }
    .nav-link {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--stone);
      transition: color 0.3s ease;
    }
    .nav-link:hover  { color: var(--parchment); }
    .nav-link.active { color: var(--parchment); }
    .nav-info {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--stone);
      transition: color 0.3s ease;
    }
    .nav-info:hover { color: var(--parchment); }

    /* ─── Coming soon ─────────────────────────────── */
    .coming-soon {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 140px 32px 100px;
    }

    .coming-soon .eyebrow {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--stone);
      opacity: 0;
      animation: fadeOnly 1.2s ease 0.1s forwards;
    }

    .coming-soon h1 {
      font-family: var(--font-display);
      font-weight: 100;
      font-size: clamp(40px, 7vw, 88px);
      letter-spacing: 0.05em;
      line-height: 1.15;
      color: var(--parchment);
      margin-top: 20px;
      opacity: 0;
      animation: fadeOnly 1.4s ease 0.3s forwards;
    }

    .coming-soon .divider {
      width: 48px;
      height: 1px;
      background: var(--sage);
      margin: 36px 0;
      transform: scaleX(0);
      opacity: 0;
      animation: dividerIn 1.2s ease 0.75s forwards;
    }

    .coming-soon p {
      font-family: var(--font-body);
      font-style: italic;
      font-size: clamp(15px, 1.6vw, 18px);
      line-height: 1.7;
      color: var(--stone);
      max-width: 44ch;
      opacity: 0;
      animation: fadeOnly 1.4s ease 0.95s forwards;
    }

    /* ─── Animations ──────────────────────────────── */
    @keyframes fadeOnly {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes dividerIn {
      from { transform: scaleX(0); opacity: 0; }
      to   { transform: scaleX(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-brand">WRM</a>
    <div class="nav-center">
      <a href="film.html" class="nav-link">Film</a>
      <a href="photo-temp.html" class="nav-link active">Photo</a>
    </div>
    <a href="info.html" class="nav-info">Info</a>
  </nav>

  <section class="coming-soon">
    <p class="eyebrow">Photo</p>
    <h1>Coming soon</h1>
    <div class="divider"></div>
    <p>A new visual journal — stills gathered from the field — is currently being prepared. Check back soon.</p>
  </section>

</body>
</html>
