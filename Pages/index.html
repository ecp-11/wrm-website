<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whispering River Media</title>
  <meta name="description" content="Documentary storytelling at the intersection of earth science and human experience.">
  <link rel="icon" href="brand_assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;300;400&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --parchment: #F2EDE6;
      --linen:     #FAF8F5;
      --ash:       #C4BFB8;
      --stone:     #857F78;
      --slate:     #44403B;
      --charcoal:  #1C1A17;
      --sage:      #7D8C7A;
      --font-display: 'Josefin Sans', sans-serif;
      --font-body:    'EB Garamond', serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #050403;
      color: var(--parchment);
      font-family: var(--font-display);
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    /* ─── Navigation ───────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 48px;
      padding: 28px 36px;
      opacity: 0;
      animation: fadeOnly 1s ease 0.4s forwards;
    }

    .nav-link {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--parchment);
      opacity: 0.72;
      transition: opacity 0.4s ease;
    }

    .nav-link:hover { opacity: 1; }

    .nav-link.nav-primary { font-size: 13px; }

    .nav-center {
      /* sits inline within the centered nav cluster */
    }

    /* ─── Info Dropdown ────────────────────────────── */
    .nav-dropdown {
      position: relative;
    }

    .nav-dropdown-trigger {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-family: var(--font-display);
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--parchment);
      opacity: 0.72;
      transition: opacity 0.4s ease;
      position: relative;
    }

    .nav-dropdown-trigger:hover { opacity: 1; }

    .nav-dropdown-trigger:focus-visible {
      outline: 1px solid var(--sage);
      outline-offset: 4px;
    }

    .nav-dropdown-trigger::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%) scaleX(0);
      width: 16px;
      height: 1px;
      background: var(--parchment);
      opacity: 0.3;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .nav-dropdown.open .nav-dropdown-trigger::after {
      transform: translateX(-50%) scaleX(1);
    }

    .nav-dropdown-menu {
      position: absolute;
      top: calc(100% + 14px);
      left: 50%;
      transform: translateX(-50%) translateY(-6px);
      min-width: 140px;
      padding: 14px 0;
      display: flex;
      flex-direction: column;
      align-items: center;

      background: rgba(5, 4, 3, 0.85);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(196, 191, 184, 0.08);
      border-radius: 6px;
      box-shadow:
        0 12px 40px -16px rgba(0, 0, 0, 0.5),
        0 2px 8px rgba(0, 0, 0, 0.2);

      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                  visibility 0.25s;
      pointer-events: none;
    }

    .nav-dropdown.open .nav-dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .nav-dropdown-item {
      display: block;
      width: 100%;
      padding: 10px 28px;
      text-align: center;
      font-family: var(--font-display);
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--parchment);
      opacity: 0.55;
      transition: opacity 0.3s ease;
      white-space: nowrap;
    }

    .nav-dropdown-item:hover,
    .nav-dropdown-item:focus-visible {
      opacity: 1;
    }

    .nav-dropdown-item:focus-visible {
      outline: 1px solid var(--sage);
      outline-offset: -2px;
    }

    /* ─── Hero ─────────────────────────────────────── */
    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Hero photo — slow zoom-out on load */
    .hero-photo {
      position: absolute;
      inset: 0;
      background: url("img/hero.jpg") center top / 145% auto no-repeat;
      transform: scale(1.15);
      animation: heroZoomOut 9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: transform;
    }

    /* Static darkening for cinematic mood */
    .hero-gradient {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        /* land shadow pulls bottom dark */
        linear-gradient(to top, rgba(4, 3, 2, 0.6) 0%, transparent 35%),
        /* sky crown darkens top */
        linear-gradient(to bottom, rgba(5, 4, 3, 0.35) 0%, transparent 28%),
        /* overall darkening so type stays legible */
        linear-gradient(rgba(8, 6, 5, 0.4), rgba(8, 6, 5, 0.4));
    }

    /* Fine grain texture */
    .hero-grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0.22;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='250' height='250'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23g)'/></svg>");
      mix-blend-mode: overlay;
    }

    /* Edge vignette softens the frame */
    .hero-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      background: radial-gradient(ellipse 90% 90% at 50% 50%, transparent 35%, rgba(4, 3, 2, 0.55) 100%);
    }

    /* ─── Title ─────────────────────────────────────── */
    .hero-title {
      position: relative;
      z-index: 10;
      text-align: center;
      opacity: 0;
      transform: translateY(-13vh);
      animation: fadeOnly 2s ease 0.1s forwards;
    }

    .hero-title-line {
      display: block;
      font-family: var(--font-display);
      font-weight: 100;
      font-size: clamp(34px, 5.9vw, 112px);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--parchment);
      line-height: 1.02;
      white-space: nowrap;
    }

    .hero-subtitle {
      display: block;
      margin-top: 10px;
      font-family: var(--font-body);
      font-style: italic;
      font-weight: 400;
      font-size: clamp(16px, 1.56vw, 20px);
      letter-spacing: 0.03em;
      text-transform: none;
      color: var(--parchment);
      opacity: 0.22;
      white-space: nowrap;
    }

    .hero-subtitle--primary {
      margin-top: 32px;
      font-family: var(--font-display);
      font-style: normal;
      font-size: clamp(11px, 1.2vw, 14px);
      letter-spacing: 0.5em;
      text-transform: uppercase;
      opacity: 0.55;
    }

    /* ─── Animations ─────────────────────────────────── */
    @keyframes fadeOnly {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes heroZoomOut {
      from { transform: scale(1.15); }
      to   { transform: scale(1); }
    }

    /* ─── Mobile: let the title wrap instead of overflowing ──── */
    @media (max-width: 600px) {
      nav { gap: 28px; padding: 22px 20px; }

      .hero-title-line {
        white-space: normal;
        font-size: clamp(34px, 11vw, 60px);
      }
      .hero-subtitle { white-space: normal; }

      .nav-dropdown-menu {
        min-width: 130px;
        padding: 10px 0;
      }

      .nav-dropdown-item {
        padding: 8px 20px;
        font-size: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation: Film / Info (dropdown) / Photo -->
  <nav>
    <a href="film.html" class="nav-link nav-primary">Film</a>
    <div class="nav-dropdown" id="infoDropdown">
      <button class="nav-dropdown-trigger nav-center"
              aria-expanded="false"
              aria-haspopup="true"
              aria-controls="infoMenu">Info</button>
      <div class="nav-dropdown-menu" id="infoMenu" role="menu">
        <a href="WRMinfo.html" class="nav-dropdown-item" role="menuitem">WRM Info</a>
        <a href="about.html" class="nav-dropdown-item" role="menuitem">About Me</a>
        <a href="WRMinfo.html#contact" class="nav-dropdown-item" role="menuitem">Get in Touch</a>
      </div>
    </div>
    <a href="photo-temp.html" class="nav-link nav-primary">Photo</a>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-photo"></div>
    <div class="hero-gradient"></div>
    <div class="hero-grain"></div>
    <div class="hero-vignette"></div>

    <div class="hero-title">
      <span class="hero-title-line">Whispering River Media</span>
      <span class="hero-subtitle hero-subtitle--primary">Documentary Films</span>
      <span class="hero-subtitle">Exploring humanity's relationship with the more-than-human world</span>
    </div>
  </section>

  <script>
    (function () {
      var dropdown = document.getElementById('infoDropdown');
      var trigger = dropdown.querySelector('.nav-dropdown-trigger');
      var menu = document.getElementById('infoMenu');

      function open() {
        dropdown.classList.add('open');
        trigger.setAttribute('aria-expanded', 'true');
      }

      function close() {
        dropdown.classList.remove('open');
        trigger.setAttribute('aria-expanded', 'false');
      }

      function toggle() {
        dropdown.classList.contains('open') ? close() : open();
      }

      trigger.addEventListener('click', function (e) {
        e.stopPropagation();
        toggle();
      });

      document.addEventListener('click', function (e) {
        if (!dropdown.contains(e.target)) close();
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') close();
      });

      menu.addEventListener('keydown', function (e) {
        var items = menu.querySelectorAll('.nav-dropdown-item');
        var current = Array.prototype.indexOf.call(items, document.activeElement);

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          items[(current + 1) % items.length].focus();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          items[(current - 1 + items.length) % items.length].focus();
        }
      });

      trigger.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowDown' && !dropdown.classList.contains('open')) {
          e.preventDefault();
          open();
          menu.querySelector('.nav-dropdown-item').focus();
        }
      });

      dropdown.addEventListener('focusout', function () {
        setTimeout(function () {
          if (!dropdown.contains(document.activeElement)) close();
        }, 0);
      });
    })();
  </script>

</body>
</html>
