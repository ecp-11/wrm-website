name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          # Everything under Pages/ -> publish at site root
          # (HTML pages, films-data.js, and the films/ detail-page subdirectory)
          cp -R Pages/. _site/
          # Shared assets live in the repo root
          cp -R images brand_assets img files _site/
          cp albums.json _site/
          # Custom domain — keep in sync with the Pages custom domain setting
          echo "www.whisperingrivermedia.com" > _site/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
