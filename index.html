<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethan C. Parrish</title>
  <meta name="description" content="Documentary storytelling at the intersection of earth science and human experience.">
  <link rel="icon" href="brand_assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;300;400&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --parchment: #F2EDE6;
      --linen:     #FAF8F5;
      --ash:       #C4BFB8;
      --stone:     #857F78;
      --slate:     #44403B;
      --charcoal:  #1C1A17;
      --sage:      #7D8C7A;
      --font-display: 'Josefin Sans', sans-serif;
      --font-body:    'EB Garamond', serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #050403;
      color: var(--parchment);
      font-family: var(--font-display);
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    /* ─── Navigation ───────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 28px 36px;
      opacity: 0;
      animation: fadeOnly 1s ease 0.4s forwards;
    }

    .nav-link {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--parchment);
      opacity: 0.72;
      transition: opacity 0.4s ease;
    }

    .nav-link:hover { opacity: 1; }

    .nav-link.nav-primary { font-size: 13px; }

    .nav-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    /* ─── Hero ─────────────────────────────────────── */
    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Hero photo — slow zoom-out on load */
    .hero-photo {
      position: absolute;
      inset: 0;
      background: url("img/hero.jpg") center top / 145% auto no-repeat;
      transform: scale(1.15);
      animation: heroZoomOut 9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: transform;
    }

    /* Static darkening for cinematic mood */
    .hero-gradient {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        /* land shadow pulls bottom dark */
        linear-gradient(to top, rgba(4, 3, 2, 0.6) 0%, transparent 35%),
        /* sky crown darkens top */
        linear-gradient(to bottom, rgba(5, 4, 3, 0.35) 0%, transparent 28%),
        /* overall darkening so type stays legible */
        linear-gradient(rgba(8, 6, 5, 0.4), rgba(8, 6, 5, 0.4));
    }

    /* Fine grain texture */
    .hero-grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0.22;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='250' height='250'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23g)'/></svg>");
      mix-blend-mode: overlay;
    }

    /* Edge vignette softens the frame */
    .hero-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      background: radial-gradient(ellipse 90% 90% at 50% 50%, transparent 35%, rgba(4, 3, 2, 0.55) 100%);
    }

    /* ─── Title ─────────────────────────────────────── */
    .hero-title {
      position: relative;
      z-index: 10;
      text-align: center;
      opacity: 0;
      transform: translateY(-13vh);
      animation: fadeOnly 2s ease 0.1s forwards;
    }

    .hero-title-line {
      display: block;
      font-family: var(--font-display);
      font-weight: 100;
      font-size: clamp(48px, 8.5vw, 128px);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--parchment);
      line-height: 1.02;
    }

    .hero-subtitle {
      display: block;
      margin-top: 10px;
      font-family: var(--font-body);
      font-style: italic;
      font-weight: 400;
      font-size: clamp(13px, 1.3vw, 17px);
      letter-spacing: 0.03em;
      text-transform: none;
      color: var(--parchment);
      opacity: 0.22;
      white-space: nowrap;
    }

    .hero-subtitle--primary {
      margin-top: 32px;
      font-family: var(--font-display);
      font-style: normal;
      font-size: clamp(9px, 1vw, 12px);
      letter-spacing: 0.5em;
      text-transform: uppercase;
      opacity: 0.55;
    }

    /* ─── Animations ─────────────────────────────────── */
    @keyframes fadeOnly {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes heroZoomOut {
      from { transform: scale(1.15); }
      to   { transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Navigation: Film / Photo / Info -->
  <nav>
    <a href="film.html" class="nav-link nav-primary">Film</a>
    <a href="info.html" class="nav-link nav-center">Info</a>
    <a href="photo-temp.html" class="nav-link nav-primary">Photo</a>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-photo"></div>
    <div class="hero-gradient"></div>
    <div class="hero-grain"></div>
    <div class="hero-vignette"></div>

    <div class="hero-title">
      <span class="hero-title-line">Ethan C. Parrish</span>
      <span class="hero-subtitle hero-subtitle--primary">Documentary Filmmaker</span>
      <span class="hero-subtitle">Exploring the Intersections of Earth Science and Humanity</span>
    </div>
  </section>

</body>
</html>
