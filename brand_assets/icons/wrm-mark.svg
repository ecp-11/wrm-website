<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100&display=swap');
    ]]></style>
